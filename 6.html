<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes App</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:linear-gradient(-45deg,#0f172a,#1e1b4b,#0c4a6e,#312e81);background-size:400% 400%;animation:bg 18s ease infinite;min-height:100vh;color:#e2e8f0}
  @keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 12s ease-in-out infinite;z-index:0;pointer-events:none}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}
  .glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15)}
  .pop-in{animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
  .pop-out{animation:out .3s ease forwards}
  @keyframes out{to{opacity:0;transform:scale(.6) rotate(-4deg)}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .fade-slide{animation:fs .4s ease both}
  @keyframes fs{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .btn-grad{background:linear-gradient(135deg,#8b5cf6,#06b6d4);box-shadow:0 8px 24px rgba(139,92,246,.45)}
  .title-grad{background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6,#a78bfa);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .modal-bg{animation:fade .25s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  input,textarea{outline:none}
  input::placeholder,textarea::placeholder{color:rgba(226,232,240,.45)}
</style>
</head>
<body>
<div class="blob w-72 h-72 bg-fuchsia-500 top-10 -left-10"></div>
<div class="blob w-80 h-80 bg-cyan-500 bottom-0 right-0" style="animation-delay:-4s"></div>
<div class="blob w-64 h-64 bg-violet-500 top-1/2 left-1/2" style="animation-delay:-8s"></div>

<main class="relative z-10 max-w-5xl mx-auto p-4 sm:p-8">
  <header class="text-center mb-8 fade-slide">
    <h1 class="title-grad text-4xl sm:text-5xl font-extrabold tracking-tight">📝 Notes App</h1>
    <p class="text-slate-300 mt-2">Add, edit, delete and view your notes</p>
  </header>

  <form id="noteForm" class="glass rounded-2xl p-5 grid gap-3 mb-5 fade-slide">
    <input id="nTitle" maxlength="80" placeholder="Note title" class="bg-white/10 rounded-xl px-4 py-3 focus:ring-2 ring-violet-400 transition">
    <textarea id="nBody" rows="3" placeholder="Write your note here..." class="bg-white/10 rounded-xl px-4 py-3 focus:ring-2 ring-violet-400 transition resize-none"></textarea>
    <button class="btn-grad rounded-xl py-3 font-semibold hover:scale-[1.02] active:scale-95 transition">➕ Add Note</button>
  </form>
  <input id="search" placeholder="🔍 Search notes..." class="w-full glass rounded-xl px-4 py-3 mb-5 focus:ring-2 ring-cyan-400 transition">
  <div id="notesGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
</main>

<!-- EDIT MODAL -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 modal-bg">
  <form id="modalForm" class="glass bg-slate-900/80 rounded-2xl p-6 w-full max-w-md grid gap-3 pop-in">
    <h2 class="text-xl font-bold">✏️ Edit Note</h2>
    <input id="mTitle" class="bg-white/10 rounded-xl px-4 py-3 focus:ring-2 ring-violet-400">
    <textarea id="mBody" rows="4" class="bg-white/10 rounded-xl px-4 py-3 focus:ring-2 ring-violet-400 resize-none"></textarea>
    <div class="flex gap-3 justify-end">
      <button type="button" id="mCancel" class="px-5 py-2 rounded-xl glass hover:scale-105 transition">Cancel</button>
      <button class="px-5 py-2 rounded-xl btn-grad hover:scale-105 transition">Save</button>
    </div>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const COLORS = ['#a78bfa','#22d3ee','#f472b6','#34d399','#fbbf24','#fb7185'];
const color = id => COLORS[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

// ---------- Data layer: uses Java server if running, otherwise browser storage ----------
const API = 'http://localhost:8080/api';
const KEY = 'notes';
let online = false;
const JSONH = { 'Content-Type': 'application/json' };
const ls = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
const lsSet = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };

const store = {
  async list() { return online ? (await fetch(`${API}/${KEY}`)).json() : ls(); },
  async add(item) {
    if (online) return fetch(`${API}/${KEY}`, { method: 'POST', headers: JSONH, body: JSON.stringify(item) });
    lsSet([...ls(), item]);
  },
  async update(item) {
    if (online) return fetch(`${API}/${KEY}/${item.id}`, { method: 'PUT', headers: JSONH, body: JSON.stringify(item) });
    lsSet(ls().map(x => x.id === item.id ? item : x));
  },
  async remove(id) {
    if (online) return fetch(`${API}/${KEY}/${id}`, { method: 'DELETE' });
    lsSet(ls().filter(x => x.id !== id));
  }
};

async function detectBackend() {
  try { online = (await fetch(`${API}/ping`, { signal: AbortSignal.timeout(1000) })).ok; }
  catch { online = false; }
}

// ---------- State ----------
let notes = [];
const seen = new Set();
let editingId = null;
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

function render() {
  const q = $('#search').value.trim().toLowerCase();
  const list = notes.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(q));
  $('#notesGrid').innerHTML = list.map((n, i) => `
    <article data-id="${n.id}" class="glass rounded-2xl p-5 flex flex-col gap-2 hover:-translate-y-1.5 hover:shadow-2xl transition duration-300 ${seen.has(n.id) ? '' : 'pop-in'}"
      style="border-top:4px solid ${color(n.id)};animation-delay:${i * 60}ms">
      <h3 class="font-bold text-lg break-words">${esc(n.title)}</h3>
      <p class="text-slate-300 text-sm whitespace-pre-wrap break-words flex-1">${esc(n.content)}</p>
      <div class="flex items-center justify-between pt-2">
        <span class="text-xs text-slate-400">${new Date(n.createdAt).toLocaleString()}</span>
        <div class="flex gap-2">
          <button data-act="edit" class="w-9 h-9 rounded-lg glass hover:scale-110 hover:rotate-12 transition">✏️</button>
          <button data-act="del" class="w-9 h-9 rounded-lg glass hover:scale-110 hover:-rotate-12 transition">🗑️</button>
        </div>
      </div>
    </article>`).join('') || `<p class="col-span-full text-center text-slate-400 py-10 fade-slide">No notes yet. Add your first note ✨</p>`;
  list.forEach(n => seen.add(n.id));
}

$('#noteForm').onsubmit = async e => {
  e.preventDefault();
  const title = $('#nTitle').value.trim(), content = $('#nBody').value.trim();
  if (!title && !content) return shake($('#noteForm'));
  const note = { id: uid(), title: title || 'Untitled', content, createdAt: Date.now() };
  await store.add(note);
  notes.unshift(note);
  e.target.reset(); render();
};
$('#search').oninput = render;

$('#notesGrid').onclick = async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('article'), id = card.dataset.id;
  if (btn.dataset.act === 'del') {
    card.classList.add('pop-out');
    await store.remove(id);
    setTimeout(() => { notes = notes.filter(n => n.id !== id); render(); }, 300);
  } else {
    const n = notes.find(x => x.id === id);
    editingId = id;
    $('#mTitle').value = n.title; $('#mBody').value = n.content;
    $('#modal').classList.remove('hidden');
    $('#mTitle').focus();
  }
};

// ---------- Modal ----------
const closeModal = () => { $('#modal').classList.add('hidden'); editingId = null; };
$('#mCancel').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };

$('#modalForm').onsubmit = async e => {
  e.preventDefault();
  if (!editingId) return;
  const title = $('#mTitle').value.trim();
  if (!title) return shake($('#modalForm'));
  const n = notes.find(x => x.id === editingId);
  n.title = title; n.content = $('#mBody').value.trim();
  await store.update(n);
  render(); closeModal();
};

(async () => { await detectBackend(); notes = await store.list(); render(); })();
</script>
</body>
</html>
